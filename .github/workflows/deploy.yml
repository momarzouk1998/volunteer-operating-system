name: Build & Deploy to Server

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 64.226.118.40
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_TOKEN
          script: |
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop volunteer-os || true
            docker rm volunteer-os || true
            docker run -d --name volunteer-os --restart unless-stopped \
              --network host \
              -e PORT=3060 \
              -e DATABASE_URL="postgresql://vos_user:Vos2026!SecureDb@localhost:5432/vos_db?schema=public" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e NEXT_PUBLIC_APP_NAME="منصة إدارة وتشغيل المتطوعين VOS" \
              -e NODE_ENV=production \
              -e HOSTNAME=0.0.0.0 \
              ghcr.io/${{ github.repository }}:latest
            nginx -t && systemctl reload nginx
