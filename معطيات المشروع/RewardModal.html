<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8fafc; padding: 15px; direction: rtl; }
    .form-group { margin-bottom: 12px; }
    label { font-size: 12px; font-weight: bold; color: #334155; display: block; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
    button { width: 100%; padding: 10px; background: #7c3aed; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #msg { margin-top: 10px; text-align: center; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>
  <form id="rewardForm">
    <div class="form-group">
      <label>كود المتطوع *</label>
      <input type="text" id="volCode" required placeholder="KAS-00001">
    </div>
    <div class="form-group">
      <label>نوع التقدير / التكريم</label>
      <select id="rewardType"><option value="">اختر التقدير...</option></select>
    </div>
    <div class="form-group">
      <label>سبب الاستحقاق *</label>
      <input type="text" id="reason" required placeholder="مثال: التميز في إدارة قافلة مطروح">
    </div>
    <div class="form-group">
      <label>النقاط الإضافية الممنوحة</label>
      <input type="number" id="points" value="100" min="10" step="10">
    </div>
    <button type="submit" id="btnSub">🏅 اعتماد التقدير وإضافة النقاط</button>
    <div id="msg"></div>
  </form>

  <script>
    window.onload = function() {
      google.script.run.withSuccessHandler(function(opts) {
        const rSel = document.getElementById('rewardType');
        opts.rewardTypes.forEach(r => rSel.add(new Option(r, r)));
      }).getSettingsOptions();
    };

    document.getElementById('rewardForm').onsubmit = function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSub');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      msg.innerText = "جاري الاعتماد...";

      const payload = {
        volCode: document.getElementById('volCode').value,
        rewardType: document.getElementById('rewardType').value,
        reason: document.getElementById('reason').value,
        points: document.getElementById('points').value
      };

      google.script.run.withSuccessHandler(function(res) {
        msg.innerText = res.message;
        msg.style.color = res.success ? '#059669' : '#dc2626';
        if(res.success) setTimeout(() => google.script.host.close(), 2000);
        else btn.disabled = false;
      }).addReward(payload);
    };
  </script>
</body>
</html>
